global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.

# tag::adocPrometheus[]
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'team'
    metrics_path: /rest-team/q/metrics
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          env: 'local'
# end::adocPrometheus[]
